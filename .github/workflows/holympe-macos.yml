name: Ho-Lympe macOS

# The Mac app (Apple Silicon), built with Homebrew's libraries (fast: no Qt build).
# Started by tools/publish_update.py with the version being published, or by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Ho-Lympe version written in the app"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install qt sdl2 libarchive zstd enet faad2 pkgconf ninja

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig:$(brew --prefix zstd)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix libarchive);$(brew --prefix enet)" \
            -DUSE_QT6=ON -DENABLE_JIT=ON
          cmake --build build

      - name: Ho-Lympe.app
        run: |
          APP=Ho-Lympe.app
          rm -rf "$APP"
          cp -R build/melonDS.app "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Ho-Lympe" "$APP/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Ho-Lympe" "$APP/Contents/Info.plist" || true
          mkdir -p "$APP/Contents/Resources"
          cp -R holympe/assets "$APP/Contents/Resources/assets"
          cp holympe/melonDS.toml "$APP/Contents/Resources/melonDS.toml"
          echo "${{ inputs.version }}" > "$APP/Contents/Resources/holympe-version.txt"
          "$(brew --prefix qt)/bin/macdeployqt" "$APP" -verbose=1
          codesign --force --deep -s - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Ho-Lympe-mac.zip

      # Kept as a release asset (artifacts have a small storage quota on this account)
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-build >/dev/null 2>&1 || gh release create mac-build --title "Ho-Lympe Mac" --notes "Dernière app Mac construite" --prerelease
          gh release upload mac-build Ho-Lympe-mac.zip --clobber